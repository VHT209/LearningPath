# Credentials and API keys. This file is a TEMPLATE -- the values below are
# placeholders. Do not commit real values. Two sane ways to create the real
# object instead of editing this file:
#
#   kubectl -n learning-path create secret generic app-secrets \
#     --from-literal=POSTGRES_USER=learning_app \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=YOUTUBE_API_KEY=...
#
#   ...or seal it (sealed-secrets / SOPS / external-secrets) and commit the
#   encrypted form. A raw Secret is only base64, not encryption.
#
# stringData: values are given as plain UTF-8 and the API server base64-encodes
# them on write. Easier to read/diff than pre-encoded data:.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: learning-path
type: Opaque
stringData:
  # Consumed by the Postgres StatefulSet (POSTGRES_USER/PASSWORD) AND by the
  # backend, which reuses the same two to build DATABASE_URL.
  POSTGRES_USER: "learning_app"
  POSTGRES_PASSWORD: "CHANGE_ME_generate_a_strong_password"

  # Backend JWT signing key. `openssl rand -hex 32`.
  SECRET_KEY: "CHANGE_ME_openssl_rand_hex_32"

  # Upstream API credentials for the AI service (services/ai.py) and YouTube
  # resource lookups.
  GROQ_API_KEY: "CHANGE_ME"
  YOUTUBE_API_KEY: "CHANGE_ME"
